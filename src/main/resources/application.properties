# Nome da aplicação
spring.application.name=stockflow

# Configurações do Banco de Dados MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/stockflow_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.packages-to-scan=com.stockflow.controller
api.security.token.secret=${JWT_SECRET:dev-secret-troque-em-producao}